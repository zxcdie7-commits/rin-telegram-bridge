<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8aa0"/>
    </marker>
    <style>
      .box{fill:#1d1d26;stroke:#3a3a4c;stroke-width:1.5}
      .hub{fill:#26203a;stroke:#8b7cf6;stroke-width:2}
      .t{fill:#ececf2;font-size:16px;font-weight:600}
      .s{fill:#9a9ab0;font-size:13px}
      .h{fill:#c9c0ff;font-size:13px;font-weight:600;letter-spacing:.08em}
      .l{stroke:#8a8aa0;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .d{stroke:#8a8aa0;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1000" height="560" rx="18" fill="#121218"/>

  <text x="40" y="44" class="h">КАНАЛЫ</text>
  <rect class="box" x="40" y="60" width="250" height="78" rx="12"/>
  <text x="58" y="92" class="t">🎙 Голос на Маке</text>
  <text x="58" y="116" class="s">«Рин, …» — живой диалог</text>
  <rect class="box" x="40" y="156" width="250" height="78" rx="12"/>
  <text x="58" y="188" class="t">💬 Аккаунт Telegram</text>
  <text x="58" y="212" class="s">этот мост: текст и голосовые</text>
  <rect class="box" x="40" y="252" width="250" height="78" rx="12"/>
  <text x="58" y="284" class="t">📞 Звонки Telegram</text>
  <text x="58" y="308" class="s">ты ↔ Рин · Рин → люди</text>
  <rect class="box" x="40" y="348" width="250" height="78" rx="12"/>
  <text x="58" y="380" class="t">🤖 Бот Hermes</text>
  <text x="58" y="404" class="s">штатный Telegram-шлюз Hermes</text>

  <text x="372" y="44" class="h">МОЗГ</text>
  <rect class="hub" x="372" y="60" width="256" height="366" rx="16"/>
  <text x="392" y="94" class="t">Hermes Agent</text>
  <text x="392" y="118" class="s">Claude Haiku 5.5 · ответ ~1 с</text>
  <text x="392" y="152" class="s">• характер — SOUL.md</text>
  <text x="392" y="176" class="s">• память о владельце</text>
  <text x="392" y="200" class="s">• поиск, терминал,</text>
  <text x="392" y="220" class="s">   напоминания, Мак</text>
  <rect x="388" y="244" width="224" height="164" rx="10" fill="#1b1730" stroke="#5b4fb0"/>
  <text x="402" y="270" class="t" style="font-size:14px">🧵 плагин «общая лента»</text>
  <text x="402" y="294" class="s">что было в других каналах</text>
  <text x="402" y="316" class="s">её настроение дня</text>
  <text x="402" y="338" class="s">ваши общие моменты</text>
  <text x="402" y="360" class="s">итоги звонков</text>
  <text x="402" y="390" class="s" style="fill:#c9c0ff">одна Рин везде</text>

  <text x="710" y="44" class="h">ОРГАНЫ ЧУВСТВ</text>
  <rect class="box" x="710" y="60" width="250" height="78" rx="12"/>
  <text x="728" y="92" class="t">👂 Слух</text>
  <text x="728" y="116" class="s">речь, настроение, смех</text>
  <rect class="box" x="710" y="156" width="250" height="78" rx="12"/>
  <text x="728" y="188" class="t">🗣 Голос</text>
  <text x="728" y="212" class="s">ElevenLabs v4 с тегами</text>
  <rect class="box" x="710" y="252" width="250" height="78" rx="12"/>
  <text x="728" y="284" class="t">🖼 Аватар</text>
  <text x="728" y="308" class="s">дышит, моргает, эмоции</text>
  <rect class="box" x="710" y="348" width="250" height="78" rx="12"/>
  <text x="728" y="380" class="t">🎮 Dota 2</text>
  <text x="728" y="404" class="s">герой, предметы, счёт</text>

  <path class="l" d="M290 99 C330 99 335 160 370 170"/>
  <path class="l" d="M290 195 L370 205"/>
  <path class="l" d="M290 291 C330 291 335 250 370 240"/>
  <path class="l" d="M290 387 C330 387 335 300 370 280"/>
  <path class="l" d="M628 140 C670 140 670 99 708 99"/>
  <path class="l" d="M628 190 L708 195"/>
  <path class="d" d="M708 291 C670 291 660 240 630 240" style="marker-end:none"/>
  <path class="d" d="M833 236 L833 250"/>
  <path class="l" d="M708 387 C670 387 660 330 630 320"/>

  <text x="40" y="470" class="s">Всё, что Рин говорит и делает, проходит через Hermes.</text>
  <text x="40" y="492" class="s">Слух и голос общие для Мака и звонков; ключи — только в .env.</text>
  <text x="40" y="530" class="s" style="fill:#6c6c80">rin-telegram-bridge · схема</text>
</svg>
